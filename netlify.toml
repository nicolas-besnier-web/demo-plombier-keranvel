# Netlify : site statique de démonstration (entreprise fictive). Seuls les fichiers du site sont publiés ;
# captures/, docs/ et les notes de travail (CLAUDE.md, AGENTS.md) restent hors du site.
[build]
  command = "rm -rf dist && mkdir dist && cp -R index.html mentions-legales.html css js fonts img dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
